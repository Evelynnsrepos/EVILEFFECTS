# Push a tag like v0.1.0 to build every effect and publish them as a GitHub Release,
# (or run it from the Actions tab with a version number), so people can download ready-made .wasm files instead of building from source.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.1.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: |
          mkdir EVILEFFECTS
          cp target/wasm32-unknown-unknown/release/evil_*.wasm EVILEFFECTS/
          zip -r EVILEFFECTS.zip EVILEFFECTS
          gh release create "$TAG" EVILEFFECTS.zip EVILEFFECTS/*.wasm --target "$GITHUB_SHA" --title "EVILEFFECTS $TAG" --generate-notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}

# Push a tag like v0.1.0 to build every effect and publish them as a GitHub Release,
# so people can download ready-made .wasm files instead of building from source.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: |
          mkdir EVILEFFECTS
          cp target/wasm32-unknown-unknown/release/evil_*.wasm EVILEFFECTS/
          zip -r EVILEFFECTS.zip EVILEFFECTS
          gh release create "$GITHUB_REF_NAME" EVILEFFECTS.zip EVILEFFECTS/*.wasm --title "EVILEFFECTS $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

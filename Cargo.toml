# EffectCraft effect plug-ins (WebAssembly, plug-in API v1; see effectcraft's docs/plugins.md).
# Build all: cargo build --release --target wasm32-unknown-unknown
[workspace]
resolver = "3"
members = ["common", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
evil-common = { path = "common" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
